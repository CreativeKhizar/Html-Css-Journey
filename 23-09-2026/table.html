<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Demo</title>
</head>
<body>
    <h1>Table Example</h1>
    <table border="1">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Harshit</td>
                <td>Vasisth</td>
            </tr>
            <tr>
                <td>Jyothi</td>
                <td>Prakash</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">You can trust this data</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
